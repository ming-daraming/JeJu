<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>웨딩 촬영 시안 보드</title>
<style>
:root{--bg:#f3ead9;--card:#fffcf5;--ink:#3b2f27;--mut:#8b7b6b;--ln:#dccbb1;--acc:#c97a4a;--kodak:#f2b53d;--sage:#9fb287;--rose:#dba6a0;--hd:#e0556b;--fl:#fbf0c9;--gc:#dfe8d0;--gt:#3f5230;--bc:#f3d9d4;--bt:#7a3b32;--paper:#fffdf6;
--d0:#e2a4a0;--d1:#a9bd8d;--d2:#9db9cc;--d0t:#f9ebe8;--d1t:#eef3e4;--d2t:#e8f0f6;--d0f:#f0c8c3;--d1f:#d3e0bd;--d2f:#c3d8e7;
--hf:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;--mf:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;--hw:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a16;--card:#2a241f;--ink:#f0e6d8;--mut:#a89885;--ln:#4a3f35;--fl:#3d3522;--gc:#33402a;--gt:#d3e3bd;--bc:#4a2b27;--bt:#f2c9c2;--d0t:#3b2a28;--d1t:#2c3324;--d2t:#25303a;--d0f:#5a3a36;--d1f:#44502f;--d2f:#34495a}}
:root[data-theme="dark"]{--bg:#1e1a16;--card:#2a241f;--ink:#f0e6d8;--mut:#a89885;--ln:#4a3f35;--fl:#3d3522;--gc:#33402a;--gt:#d3e3bd;--bc:#4a2b27;--bt:#f2c9c2;--d0t:#3b2a28;--d1t:#2c3324;--d2t:#25303a;--d0f:#5a3a36;--d1f:#44502f;--d2f:#34495a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.16;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .22 0 0 0 0 .15 0 0 0 .7 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.strip{height:22px;background:linear-gradient(90deg,transparent 0 8px,var(--bg) 8px 20px,transparent 20px 28px) 0 5px/28px 12px repeat-x,#2b211a}
header{max-width:1280px;margin:auto;padding:26px 20px 6px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.stk{font:700 12px var(--mf);letter-spacing:.14em;color:#e8772e;text-shadow:0 0 6px rgba(232,119,46,.45);border:1.5px solid #e8772e;padding:1px 10px;border-radius:3px}
h1{font:700 36px/1.2 var(--hf);margin:10px 0 2px;letter-spacing:-.01em}
.sub2{font:400 20px var(--hw);color:var(--mut)}
button{font:inherit;cursor:pointer;color:var(--ink)}
.btns button{border:1.5px solid var(--ink);background:var(--card);padding:6px 14px;border-radius:4px;margin-left:6px;font:700 13px var(--mf)}
.nav,.sub{display:flex;gap:6px;flex-wrap:wrap;max-width:1280px;margin:14px auto 10px;padding:0 20px}
.nav button{background:transparent;border:0;border-bottom:2px dashed var(--ln);padding:9px 16px;font:700 15px var(--mf);color:var(--mut)}
.nav button b{color:var(--acc);margin-right:4px}
.nav button.on{background:var(--kodak);color:#3b2f27;border-bottom:2px solid #3b2f27;border-radius:6px 6px 0 0}
.nav button.on b{color:#3b2f27}
.sub{margin:2px 0 22px;padding:0}
.sub button{background:var(--card);border:1.5px dashed var(--sage);padding:4px 14px;border-radius:4px;font:700 13px var(--mf)}
.sub button.on{background:var(--sage);border-style:solid;color:#2c3a20}
main{max-width:1280px;margin:auto;padding:4px 20px 80px}
.panel,.sp{display:none;counter-reset:fr}.panel.on,.sp.on{display:block}
.pt{display:none;font:700 22px var(--hf);margin:0 0 12px}
h4.sec{display:flex;align-items:center;gap:8px;margin:34px 0 18px;padding-bottom:6px;border-bottom:1.5px solid var(--ink);font:700 19px var(--hf)}
h4.sec::before{counter-increment:fr;content:"No." counter(fr,decimal-leading-zero);font:700 13px var(--mf);color:#fff;background:var(--acc);padding:1px 8px;border-radius:3px}
h5{margin:0 0 8px;font:700 18px var(--hf)}
h6{margin:8px 0 4px;font:700 12px var(--mf);letter-spacing:.04em;display:inline-block;padding:1px 10px;border:1.5px solid var(--ink);border-radius:3px}
.card,.blk{position:relative;background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:18px 16px 16px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 12px 24px -12px rgba(90,60,30,.3)}
.card::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:20px;margin-left:-35px;background:rgba(224,196,140,.62);transform:rotate(-2deg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.blk{background:var(--fl);transform:rotate(-.4deg)}
.blk h4{margin:0 0 4px;font:700 13px var(--mf);letter-spacing:.1em;color:var(--acc)}
.blk .ed{font:400 17px/1.5 var(--hw);color:var(--ink)}
.grid,.grid2,.cats,.mk2{display:grid;gap:26px 22px}
.grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.sumg{grid-template-columns:repeat(4,minmax(0,1fr))}
.one{grid-template-columns:minmax(0,1fr)}
@media(max-width:900px){.sumg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.sumg{grid-template-columns:1fr}}
.wide{grid-column:1/-1}
.grid2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.cats{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.mk2{grid-template-columns:1fr 1fr;align-items:start}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.mk2{grid-template-columns:1fr}}
@media(max-width:560px){.pair{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}h1{font-size:28px}}
.good h6{background:var(--gc);color:var(--gt);border-color:var(--sage)}
.bad h6{background:var(--bc);color:var(--bt);border-color:var(--rose)}
.ed{outline:0;white-space:pre-wrap;min-height:1.5em;padding:2px 6px;border-radius:4px;word-break:keep-all;overflow-wrap:anywhere}
.ed:hover,.ed:focus{background:var(--fl);box-shadow:inset 0 -2px 0 var(--acc)}
.ed:empty::before{content:attr(data-ph);color:var(--mut)}
.zone{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;margin-top:8px;padding:8px;border:1.5px dashed var(--ln);border-radius:6px}
.good .zone{border-color:var(--sage)}.bad .zone{border-color:var(--rose)}
.zone.over{background:var(--fl)}
.land{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.ph,.slot{aspect-ratio:3/4;position:relative;margin:0;min-width:0}
.land .ph,.land .slot{aspect-ratio:4/3}
.ph{background:var(--paper);border:1px solid var(--ln);box-shadow:0 4px 10px rgba(70,50,30,.22)}
.zone .ph:nth-child(3n+1){transform:rotate(-1.2deg)}.zone .ph:nth-child(3n+2){transform:rotate(.9deg)}
.ph img{position:absolute;left:6px;top:6px;width:calc(100% - 12px);height:calc(100% - 26px);object-fit:cover;cursor:zoom-in;filter:sepia(.12) saturate(.95)}
.land .ph img{height:calc(100% - 26px)}
.ph.on{box-shadow:0 0 0 3px var(--hd),0 4px 10px rgba(70,50,30,.22)}
.slot{display:grid;place-items:center;border:1.5px dashed var(--mut);border-radius:4px;background:transparent;color:var(--mut);font:700 11px var(--mf);letter-spacing:.04em;text-align:center}
.slot:hover{border-color:var(--acc);color:var(--acc)}
.x,.hb{position:absolute;top:10px;border:0;border-radius:50%;width:24px;height:24px;line-height:24px;padding:0;text-align:center;background:rgba(255,253,246,.92);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.x{right:10px;font-size:15px;color:#3b2f27}
.hb{left:10px;font-size:15px;color:var(--hd)}
.ph.on .hb{background:var(--hd);color:#fff}
.list ul{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:flex-start;gap:8px;padding:3px 0;border-bottom:1px dotted var(--ln)}
.list li .ed{flex:1}
.list input[type=checkbox]{margin-top:7px;width:18px;height:18px;accent-color:var(--acc)}
.list li:has(input:checked) .ed{text-decoration:line-through;color:var(--mut)}
.x2{border:0;background:none;color:var(--mut);font-size:20px;line-height:1}.x2:hover{color:var(--hd)}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;font:inherit;padding:6px 10px;border:1.5px solid var(--ln);border-radius:4px;background:var(--paper);color:#3b2f27;min-width:0}
.add button,.addrow{border:1.5px solid var(--ink);background:var(--kodak);color:#3b2f27;border-radius:4px;padding:5px 14px;font:700 13px var(--mf)}
.addrow{margin:6px 6px 0 0}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.tools .hint{margin:0 0 0 6px}
.tw{overflow-x:auto;padding:0 6px 8px 0}
table{border-collapse:collapse;width:100%;min-width:780px;table-layout:fixed;background:var(--card);border:1.5px solid var(--ink)}
th,td{border:1px solid var(--ink);padding:6px 8px;vertical-align:middle;text-align:center;font-size:14px;height:36px;white-space:pre-wrap;line-height:1.35}
td[contenteditable],th[contenteditable]{outline:0}
th{font:700 15px var(--hf);color:#3b2f27}
th.d0{background:var(--d0)}th.d1{background:var(--d1)}th.d2{background:var(--d2)}
th.s0{background:var(--d0f)}th.s1{background:var(--d1f)}th.s2{background:var(--d2f)}
td.d0{background:var(--d0t)}td.d1{background:var(--d1t)}td.d2{background:var(--d2t)}
td.d0.fl{background:var(--d0f)}td.d1.fl{background:var(--d1f)}td.d2.fl{background:var(--d2f)}
td.fl{font-weight:700}
td.sel{outline:3px solid var(--hd)!important;outline-offset:-3px}
th:first-child,td.tm{width:58px;font:700 14px var(--mf);background:var(--bg);color:var(--ink)}
td.rx{width:30px;border:0;background:none;padding:0}
.hint{color:var(--mut);font-size:14px;margin:4px 0 12px}
.blk .hint{color:var(--mut);margin-top:8px}
.pose{margin-bottom:30px}
.phd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pname{flex:1;font:700 22px var(--hf)}
.pose .zone{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
#lb{position:fixed;inset:0;background:rgba(20,14,8,.9);display:none;place-items:center;z-index:99;cursor:zoom-out}
#lb.on{display:grid}#lb img{max-width:94vw;max-height:94vh;border:10px solid var(--paper);border-bottom-width:30px}
.phone{max-width:430px;margin:0 auto;display:grid;gap:8px}
.jh-hd{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:6px}
.jh-hd h3{margin:8px 0 0;font:700 24px var(--hf)}
.lock{max-width:340px;margin:24px auto;text-align:center;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:28px 22px;box-shadow:0 12px 24px -12px rgba(90,60,30,.3)}
.lk{font-size:38px}.lock h3{margin:6px 0 2px;font:700 20px var(--hf)}
.dots{display:flex;gap:14px;justify-content:center;margin:16px 0 20px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}.dots i.on{background:var(--acc);border-color:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:56px;border:1.5px solid var(--ink);background:var(--paper);color:#3b2f27;border-radius:12px;font:700 22px var(--mf)}
.pad button:active{background:var(--kodak)}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.phone h4.sec{margin:26px 0 14px}
.tl{display:grid;gap:8px}
.tr{display:grid;grid-template-columns:46px 1fr 1fr;gap:6px;align-items:stretch}
.tr.th b{text-align:center;font:700 13px var(--mf);padding:2px;border-radius:4px;color:#3b2f27}
.tr.th b:nth-child(2){background:var(--d0)}.tr.th b:nth-child(3){background:var(--d2)}
.tt{font:700 14px var(--mf);background:var(--ink);color:var(--bg);border-radius:6px;display:grid;place-items:center}
.tc{border-radius:8px;padding:4px 6px;font-size:14px;display:flex;align-items:center;min-width:0}
.tc .ed{flex:1;min-width:0}
.tc.m{background:var(--d0t);border:1px solid var(--d0)}
.tc.j{background:var(--d2t);border:1px solid var(--d2)}
.tc.both{grid-column:2/4;background:var(--fl);border:1px dashed var(--acc);font-weight:700;text-align:center}
.tc.hot{background:var(--hd);border-color:var(--hd);color:#fff}
.tc.hot .ed:hover,.tc.hot .ed:focus{background:rgba(255,255,255,.2);box-shadow:none}
.lkb{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;margin-bottom:8px;border:1.5px solid var(--ink);border-radius:8px;text-decoration:none;background:var(--paper);color:#3b2f27;font-weight:700}
.lkb span{font:700 12px var(--mf);color:var(--acc);white-space:nowrap}
.numl ul{counter-reset:n}
.numl li::before{counter-increment:n;content:counter(n);flex:none;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font:700 12px/22px var(--mf);text-align:center;margin-top:4px}
.gd{border-left:4px solid var(--kodak);padding:2px 0 2px 10px;margin:10px 0}
.gd b{font:700 13px var(--mf);color:var(--acc)}
#r3d{width:100%;aspect-ratio:1/1;max-height:75vh;margin-top:10px;border-radius:12px;overflow:hidden;background:linear-gradient(#f4ead6,#e6d5b6);border:1px solid var(--ln)}
#r3d canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.rbtn{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 8px}
.rbtn button{border:1.5px solid var(--ink);background:var(--card);border-radius:4px;padding:3px 10px;font:700 12px var(--mf)}
#rinfo{min-height:46px;background:var(--fl);border-radius:8px;padding:8px 10px;font-size:14px}
.lg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.lg i{display:inline-block;width:11px;height:11px;border:1px solid #3b2f27;border-radius:2px;margin-right:4px;vertical-align:-1px}
@media print{
@page{size:13.333in 7.5in;margin:.35in}
:root:not([data-theme="x"]),:root[data-theme="dark"]{--bg:#fff;--card:#fff;--ink:#2b2321;--mut:#888;--ln:#ccc;--fl:#fbf0c9;--gc:#dfe8d0;--gt:#3f5230;--bc:#f3d9d4;--bt:#7a3b32;--d0t:#f9ebe8;--d1t:#eef3e4;--d2t:#e8f0f6;--d0f:#f0c8c3;--d1f:#d3e0bd;--d2f:#c3d8e7;padding:0}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:none!important;transform:none!important}
body{background:#fff;font-size:10pt}
body::after,.strip,.card::before{display:none}
header,.nav,.sub,.add,.x,.x2,.slot,.addrow,.tools,td.rx,.hint,#lb{display:none!important}
.panel,.sp{display:none!important}
body:not(.all) .panel.on,body.all .panel{display:block!important}
.panel{break-before:page}
.panel .sp{display:block!important;break-before:page}
.panel .sp:first-of-type{break-before:auto}
.panel .sp[data-s="jh"]{display:none!important}
.pt{display:block}.panel>.pt:has(+.sub){display:none}
main{padding:0;max-width:none}
.card,.col,.blk,tr,.ph{break-inside:avoid}
.card,.blk{border:1px solid #ccc;padding:10px}
.ph{box-shadow:none;border:1px solid #ccc}
.zone{border:0!important;padding:0;gap:8px;grid-template-columns:repeat(auto-fill,minmax(1.2in,1fr))}
.land{grid-template-columns:repeat(auto-fill,minmax(1.6in,1fr))}
.one{grid-template-columns:minmax(0,1.5in)}
.zone:not(:has(.ph)){display:none}
.ed:empty{display:none}.ed:hover{background:none;box-shadow:none}
th,td{font-size:9pt;height:.3in}table{min-width:0}
.grid{grid-template-columns:repeat(3,1fr)}.sumg{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:1fr 1fr}.cats{grid-template-columns:repeat(3,1fr)}.mk2{grid-template-columns:1fr 1fr}
.poses>.pose+.pose{break-before:page}
.pose .zone{grid-template-columns:repeat(auto-fill,minmax(1.3in,1fr))}
}
</style>
</head>
<body>
<div class="strip"></div>
<header>
  <div><span class="stk">WEDDING ROLL · 24 EXP.</span><h1>웨딩 촬영 시안 보드</h1><div class="sub2">우리가 찍고 싶은 장면들, 한 롤에 모아두기</div></div>
  <div class="btns"><button data-act="print1">🖨 현재 탭 인쇄</button><button data-act="print2">🖨 전체 인쇄</button></div>
</header>
<nav class="nav" id="nav"></nav>
<main id="app"></main>
<div id="lb"><img alt=""></div>
<input type="file" id="fi" accept="image/*" multiple hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
let S={t:{},l:{},p:{},sch:null,tab:'prep',sub:{req:'list',salon:'makeup',ite:'intro'}};
/* ---------- 저장 (브라우저 IndexedDB) ---------- */
let db,tm;
const idb=()=>new Promise(r=>{try{const q=indexedDB.open('wedding-board',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const load=async()=>{try{db=await idb();if(!db)return;await new Promise(r=>{const g=db.transaction('s').objectStore('s').get('state');g.onsuccess=()=>{if(g.result)Object.assign(S,g.result);r()};g.onerror=()=>r()})}catch(e){}};
const save=()=>{clearTimeout(tm);tm=setTimeout(()=>{try{db&&db.transaction('s','readwrite').objectStore('s').put(S,'state')}catch(e){}},300)};
/* ---------- 컴포넌트 ---------- */
const T=(k,d='',ph='내용을 입력하세요')=>`<div class="ed" contenteditable="true" data-t="${k}" data-ph="${ph}">${esc(S.t[k]??d)}</div>`;
const zin=(k,min,h,max)=>{const a=S.p[k]||[];let s=a.map(p=>`<figure class="ph${p.h?' on':''}" data-id="${p.id}"><img src="${p.s}" alt=""><button class="x" data-act="delp" title="삭제">×</button>${h?`<button class="hb" data-act="heart" title="꼭 찍고 싶은 컷">${p.h?'♥':'♡'}</button>`:''}</figure>`).join('');
 const n=max?Math.max(max-a.length,0):Math.max(min-a.length,1);
 for(let i=0;i<n;i++)s+=`<button class="slot" data-act="slot">＋ 사진<br>드래그 / 클릭</button>`;return s};
const zone=(k,o={})=>`<div class="zone${o.land?' land':''}${o.max?' one':''}" data-z="${k}" data-min="${o.min||1}" data-h="${o.h?1:0}" data-max="${o.max||0}">${zin(k,o.min||1,o.h,o.max)}</div>`;
const rz=z=>{z.innerHTML=zin(z.dataset.z,+z.dataset.min,z.dataset.h==='1',+z.dataset.max)};
const col=(c,label,k,txt,min,h)=>`<div class="col ${c}"><h6>${label}</h6>${txt===null?'':T(k,txt)}${zone(k,{min,h})}</div>`;
const pair=(k,[g,b],min,h,L=['원해요','피해주세요'])=>`<div class="pair">${col('good',L[0],k+':g',g,min,h)}${col('bad',L[1],k+':b',b,min,h)}</div>`;
const pz=(k,min,h)=>`<div class="pair">${col('good','원해요',k+':g',null,min,h)}${col('bad','피해주세요',k+':b',null,min,h)}</div>`;
const LD=(k,d)=>S.l[k]||(S.l[k]=d.map(t=>({id:uid(),t,c:0})));

function mergeSel(){const q=rect();if(!q)return;let[r1,c1,r2,c2]=q;const g=S.sg.g;let ch=1;
 while(ch){ch=0;for(let i=0;i<g.length;i++)for(let j=0;j<6;j++){const c=g[i][j];if(c.h)continue;if(hit([r1,c1,r2,c2],i,j,c)){const a=Math.min(r1,i),b=Math.min(c1,j),d=Math.max(r2,i+c.rs-1),e=Math.max(c2,j+c.cs-1);if(a!==r1||b!==c1||d!==r2||e!==c2){r1=a;c1=b;r2=d;c2=e;ch=1}}}}
 const tx=[];for(let i=r1;i<=r2;i++)for(let j=c1;j<=c2;j++){const c=g[i][j];if(!c.h&&c.t.trim())tx.push(c.t.trim());g[i][j]={t:'',rs:1,cs:1,h:1}}
 g[r1][c1]={t:tx.join('\n'),rs:r2-r1+1,cs:c2-c1+1,h:0};sa=[r1,c1];sb=null;sp=1}
function unmergeSel(){const q=rect();if(!q)return;const g=S.sg.g;for(let i=0;i<g.length;i++)for(let j=0;j<6;j++){const c=g[i][j];if(c.h||!hit(q,i,j,c))continue;for(let a=i;a<i+c.rs;a++)for(let b=j;b<j+c.cs;b++)if(a!==i||b!==j)g[a][b].h=0;c.rs=c.cs=1}}
function delRow(r){const g=S.sg.g;for(let i=0;i<=r;i++)for(let j=0;j<6;j++){const c=g[i][j];if(c.h||i+c.rs-1<r)continue;if(i<r)c.rs--;else if(c.rs>1){const n=g[r+1][j];n.h=0;n.t=c.t;n.rs=c.rs-1;n.cs=c.cs}}g.splice(r,1);S.sg.tm.splice(r,1);sa=sb=null;sp=0}
